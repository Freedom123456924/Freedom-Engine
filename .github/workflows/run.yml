name: Global Freedom Engine Auto Publisher

on:
  schedule:
    - cron: '0 6 * * *' # روزانہ صبح 6 بجے خودکار چلے گا
  workflow_dispatch: # مینوئل (خود بھی چلا سکتے ہیں)

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai feedparser

      - name: Run Freedom Engine Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
